name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.0.0'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

# Pinned Flutter version. F-Droid extracts this exact value from the recipe so
# its build matches upstream. Defined once here and reused by both jobs.
env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Build split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # ABI splits keep each APK small instead of one fat APK.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     GymMane-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   GymMane-armeabi-v7a.apk
          mv app-x86_64-release.apk        GymMane-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gymmane-apks
          path: build/app/outputs/flutter-apk/GymMane-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: GymMane ${{ inputs.tag }}
          files: |
            build/app/outputs/flutter-apk/GymMane-arm64-v8a.apk
            build/app/outputs/flutter-apk/GymMane-armeabi-v7a.apk
            build/app/outputs/flutter-apk/GymMane-x86_64.apk
